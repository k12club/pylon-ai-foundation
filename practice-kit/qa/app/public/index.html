<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบเบิกวัสดุ</title>
<style>
  :root {
    --bg: #f4f6f8;
    --surface: #ffffff;
    --ink: #1c2430;
    --muted: #4d5866;
    --line: #d5dbe3;
    --accent: #1f4fa8;
    --accent-ink: #ffffff;
    --ok: #14713f;
    --ok-soft: #e2f2e8;
    --warn: #8a5300;
    --warn-soft: #fdf1dc;
    --bad: #a3261c;
    --bad-soft: #fbe6e4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Leelawadee UI", "Segoe UI", Tahoma, "Thonburi", sans-serif;
    font-size: 16px;
    line-height: 1.6;
  }
  [hidden] { display: none !important; }
  .wrap { max-width: 72rem; margin: 0 auto; padding: 1.5rem 16px 3rem; display: grid; gap: 1.25rem; }
  h1 { font-size: 1.5rem; margin: 0; }
  h2 { font-size: 1.15rem; margin: 0 0 0.75rem; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 1rem; min-width: 0; }
  .topbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.75rem; }
  .who { color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr)); gap: 0.75rem; }
  .field { display: grid; gap: 0.25rem; min-width: 0; }
  label { font-weight: 600; font-size: 0.95rem; }
  input, select, textarea, button { font: inherit; }
  input, select, textarea {
    border: 1px solid var(--line); border-radius: 6px; padding: 0.45rem 0.6rem;
    background: var(--surface); color: var(--ink); width: 100%;
  }
  textarea { min-height: 4.5rem; resize: vertical; }
  .actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.75rem; }
  button { border-radius: 6px; padding: 0.45rem 1rem; cursor: pointer; border: 1px solid var(--accent); }
  .primary { background: var(--accent); color: var(--accent-ink); }
  .secondary { background: var(--surface); color: var(--accent); }
  .danger { background: var(--surface); color: var(--bad); border-color: var(--bad); }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
  .msg { margin: 0.5rem 0 0; min-height: 1.6em; }
  .msg.ok { color: var(--ok); }
  .msg.err { color: var(--bad); }
  .table-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; min-width: 52rem; }
  th, td { text-align: left; padding: 0.5rem 0.6rem; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 0.95rem; color: var(--muted); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tfoot td { font-weight: 700; border-bottom: 0; }
  .status { display: inline-block; padding: 0 0.5rem; border-radius: 999px; font-size: 0.9rem; white-space: nowrap; }
  .status.pending { background: var(--warn-soft); color: var(--warn); }
  .status.approved { background: var(--ok-soft); color: var(--ok); }
  .status.rejected { background: var(--bad-soft); color: var(--bad); }
  .row-actions { display: grid; gap: 0.35rem; min-width: 12rem; position: relative; }
  .row-actions .inline { display: flex; gap: 0.35rem; }
  .row-actions button, tbody td:first-child { white-space: nowrap; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .login { max-width: 24rem; }
  #main-view { display: grid; gap: 1.25rem; min-width: 0; }
</style>
</head>
<body>
<main class="wrap">
  <h1>ระบบเบิกวัสดุ</h1>

  <section class="card login" id="login-view" aria-labelledby="login-title">
    <h2 id="login-title">เข้าสู่ระบบ</h2>
    <form id="login-form" class="grid">
      <div class="field">
        <label for="username">ชื่อผู้ใช้</label>
        <input id="username" name="username" autocomplete="username" data-testid="login-username">
      </div>
      <div class="field">
        <label for="password">รหัสผ่าน</label>
        <input id="password" name="password" type="password" autocomplete="current-password" data-testid="login-password">
      </div>
      <div class="actions"><button type="submit" class="primary" data-testid="login-submit">เข้าสู่ระบบ</button></div>
    </form>
    <p class="msg err" id="login-error" role="alert" data-testid="login-error"></p>
  </section>

  <div id="main-view" hidden>
    <div class="card topbar">
      <span class="who" id="who" data-testid="current-user"></span>
      <button type="button" class="secondary" id="logout" data-testid="logout">ออกจากระบบ</button>
    </div>

    <section class="card" id="create-section" aria-labelledby="create-title" hidden>
      <h2 id="create-title">สร้างคำขอเบิก</h2>
      <form id="create-form">
        <div class="grid">
          <div class="field">
            <label for="material">วัสดุ</label>
            <select id="material" data-testid="create-material"></select>
          </div>
          <div class="field">
            <label for="qty">จำนวน</label>
            <input id="qty" inputmode="numeric" data-testid="create-qty">
          </div>
          <div class="field">
            <label for="site">ไซต์งาน</label>
            <select id="site" data-testid="create-site"></select>
          </div>
          <div class="field">
            <label for="need-date">วันที่ต้องการใช้</label>
            <input id="need-date" placeholder="YYYY-MM-DD" data-testid="create-need-date">
          </div>
        </div>
        <div class="field" style="margin-top:0.75rem">
          <label for="note">หมายเหตุ</label>
          <textarea id="note" data-testid="create-note"></textarea>
        </div>
        <div class="actions"><button type="submit" class="primary" data-testid="create-submit">บันทึกคำขอ</button></div>
      </form>
      <p class="msg" id="create-message" role="status" data-testid="create-message"></p>
    </section>

    <section class="card" aria-labelledby="list-title">
      <h2 id="list-title">รายการคำขอ</h2>
      <form id="filter-form">
        <div class="grid">
          <div class="field">
            <label for="f-status">สถานะ</label>
            <select id="f-status" data-testid="filter-status">
              <option value="">ทั้งหมด</option>
              <option value="pending">รออนุมัติ</option>
              <option value="approved">อนุมัติแล้ว</option>
              <option value="rejected">ไม่อนุมัติ</option>
            </select>
          </div>
          <div class="field">
            <label for="f-site">ไซต์งาน</label>
            <select id="f-site" data-testid="filter-site"></select>
          </div>
          <div class="field">
            <label for="f-from">ตั้งแต่วันที่</label>
            <input id="f-from" placeholder="YYYY-MM-DD" data-testid="filter-from">
          </div>
          <div class="field">
            <label for="f-to">ถึงวันที่</label>
            <input id="f-to" placeholder="YYYY-MM-DD" data-testid="filter-to">
          </div>
          <div class="field">
            <label for="f-q">ค้นหา</label>
            <input id="f-q" placeholder="ชื่อวัสดุ รหัส หรือหมายเหตุ" data-testid="filter-q">
          </div>
        </div>
        <div class="actions">
          <button type="submit" class="primary" data-testid="filter-apply">ค้นหา</button>
          <button type="button" class="secondary" id="filter-clear" data-testid="filter-clear">ล้างตัวกรอง</button>
        </div>
      </form>
      <p class="msg" id="action-message" role="status" data-testid="action-message"></p>
      <div class="table-wrap">
        <table data-testid="request-table">
          <thead>
            <tr>
              <th>เลขที่</th>
              <th>วันที่ต้องการใช้</th>
              <th>วัสดุ</th>
              <th class="num">จำนวน</th>
              <th>ไซต์งาน</th>
              <th>ผู้ขอ</th>
              <th class="num">ยอดสุทธิ (บาท)</th>
              <th>สถานะ</th>
              <th id="action-head" hidden>ดำเนินการ</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
          <tfoot>
            <tr>
              <td colspan="6">ยอดรวม</td>
              <td class="num" data-testid="total-net" id="total-net">0.00</td>
              <td colspan="2"></td>
            </tr>
          </tfoot>
        </table>
      </div>
    </section>
  </div>
</main>
<script src="/format.js"></script>
<script src="/app.js"></script>
</body>
</html>
